name: Publish

on:
  release:
    types: [ created ]

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      # Requires these repository secrets:
      #   CENTRAL_PORTAL_USERNAME / CENTRAL_PORTAL_PASSWORD - Central Portal user token (central.sonatype.com)
      #   SIGNING_KEY / SIGNING_PASSWORD                     - ASCII-armored GPG private key + passphrase
      - name: Publish to Maven Central
        run: ./gradlew publishAggregationToCentralPortal
        env:
          CENTRAL_PORTAL_USERNAME: ${{ secrets.CENTRAL_PORTAL_USERNAME }}
          CENTRAL_PORTAL_PASSWORD: ${{ secrets.CENTRAL_PORTAL_PASSWORD }}
          SIGNING_KEY: ${{ secrets.SIGNING_KEY }}
          SIGNING_PASSWORD: ${{ secrets.SIGNING_PASSWORD }}
